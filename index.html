  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: Inter, sans-serif; color: #111; }
  html.dark, html.dark body { background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: text; }
  .top {
    position: fixed; top: 28px; left: 28px; right: 28px; z-index: 2;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .logo { display: block; width: 48px; height: 48px; pointer-events: auto; }
  .logo img { display: block; width: 100%; height: 100%; }
  html.dark .logo img { filter: invert(1); }
  .credit { font: 500 11px/1 Inter, sans-serif; letter-spacing: .09em; color: #777; }
  .controls {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 26px; z-index: 2; white-space: nowrap;
    font: 500 11px/1 Inter, sans-serif; letter-spacing: .09em;
  }
  button {
    appearance: none; border: 0; background: transparent; color: #777;
    padding: 8px 2px; font: inherit; letter-spacing: inherit; cursor: pointer;
    transition: color .15s ease;
  }
  button:hover, button[aria-pressed="true"] { color: #111; }
  button:focus-visible { outline: 1px solid #111; outline-offset: 5px; }
  html.dark button:hover, html.dark button[aria-pressed="true"] { color: #fff; }
  html.dark button:focus-visible { outline-color: #fff; }
  .panel {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 3;
    width: min(440px, 92vw); max-height: min(46vh, 420px); overflow: auto;
    background: #fff; border: 1px solid #e4e4e4;
  }
  html.dark .panel { background: #000; border-color: #333; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  .grid button {
    height: 44px; padding: 0; color: #111;
    font: 400 22px/1 Inter, "Inter Glyphs", sans-serif; letter-spacing: 0;
    border-right: 1px solid #eee; border-bottom: 1px solid #eee;
  }
  .grid button:hover { color: #f3552e; }
  html.dark .grid button { color: #fff; border-color: #222; }
  html.dark .grid button:hover { color: #f3552e; }
  @media (max-width: 600px) {
    .top { top: 20px; left: 20px; right: 20px; }
    .logo { width: 36px; height: 36px; }
    .controls { bottom: 24px; width: 92vw; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }
    .panel { bottom: 100px; }
  }
</style>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('stage');
  const ctx = canvas.getContext('2d');
  const gravityButton = $('gravity'), magnetButton = $('magnet'), explodeButton = $('explode');
  const moreButton = $('more'), darkButton = $('dark'), resetButton = $('reset');
  const panel = $('panel'), grid = $('grid'), logoEl = $('logo');
  const GLYPHS = [...'ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ⓪①②③④⑤⑥⑦⑧⑨🄰🄱🄲🄳🄴🄵🄶🄷🄸🄹🄺🄻🄼🄽🄾🄿🅀🅁🅂🅃🅄🅅🅆🅇🅈🅉←↑→↓↔↕↖↗↘↙↩↪↰↱↳↴↵↺↻⇐⇒⇔⇞⇟⇤⇥⇧⇪⟵⟶⟷⟸⟹⟺⌘⌥⌃⌫⌦⏎⎋⏏■□▪▲△▶▷▼▽◀◁◆◇◊○●◯★☆♡♥⚠✓✗∞≠≤≥≈√∑∂∆⊕⊖⊗⊘'];
  const FONT = 'Inter, "Inter Glyphs", sans-serif';
  const ORANGE = '#f3552e';
  const weights = [200, 300, 400, 500, 600, 700, 800];
  const DEFAULT_WEIGHT = 3; // 500
  const state = {
    text: '', letters: [], gravity: false, magnet: false, locked: false,
    flying: false, dirty: false, dark: false,
    weightIndex: DEFAULT_WEIGHT, sizeScale: 1,
    active: null, pointer: null, mouse: null, hover: null,
    magnetTarget: null, last: 0, blink: 0
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);

  function resize() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout(false);
  }
  function fontSize() { return clamp(Math.min(W * .105, H * .22) * state.sizeScale, 24, 4000); }
  function floorY() { return H - 55; }
  function ink() { return state.dark ? '#fff' : '#111'; }
  function metrics(ch, size) {
    ctx.font = `${weights[state.weightIndex]} ${size}px ${FONT}`;
    const m = ctx.measureText(ch);
    return { w: Math.max(m.width, size * .28), h: size * .9 };
  }
  function layout(preserve) {
    const size = fontSize();
    const gap = size * .005;
    const chars = [...state.text];
    const dims = chars.map(ch => metrics(ch, size));
    const total = dims.reduce((s, m) => s + m.w, 0) + Math.max(0, chars.length - 1) * gap;
    let x = (W - total) / 2;
    const y = H * .49;
    const old = preserve ? state.letters : [];
    if (!preserve) { state.active = null; state.pointer = null; state.flying = false; state.dirty = false; }
    state.letters = chars.map((ch, i) => {
      const m = dims[i];
      const prev = old[i] && old[i].ch === ch ? old[i] : null;
      let letter;
      if (prev) { letter = prev; letter.w = m.w; letter.h = m.h; }
      else letter = { ch, x: x + m.w / 2, y, vx: 0, vy: 0, angle: 0, va: 0, w: m.w, h: m.h };
      x += m.w + gap;
      return letter;
    });
  }
  // Untouched type re-lays itself out. Moved type keeps its arrangement and scales around the centre.
  function refit(prevSize) {
    if (!state.dirty) { layout(false); return; }
    if (prevSize) {
      const k = fontSize() / prevSize, cx = W / 2, cy = H * .49;
      for (const a of state.letters) { a.x = cx + (a.x - cx) * k; a.y = cy + (a.y - cy) * k; }
    }
    layout(true);
  }
  function drawLetter(letter, size) {
    if (letter.ch === ' ') return;
    ctx.save();
    ctx.translate(letter.x, letter.y);
    ctx.rotate(letter.angle);
    ctx.font = `${weights[state.weightIndex]} ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = (letter === state.active || letter === state.hover) ? ORANGE : ink();
    ctx.fillText(letter.ch, 0, 0);
    ctx.restore();
  }
  // The text cursor sits at the right edge of the last character.
  function drawCaret(now, size) {
    if (state.locked || state.gravity || state.magnet || state.flying || state.active) return;
    if (Math.floor((now - state.blink) / 530) % 2 !== 0) return;
    const last = state.letters[state.letters.length - 1];
    const x = last ? last.x + last.w / 2 + size * .02 : W / 2;
    const y = last ? last.y : H * .49;
    const cw = Math.max(2, size * .01);
    ctx.fillStyle = ink();
    ctx.fillRect(x - cw / 2, y - size * .39, cw, size * .78);
  }

  // Box collisions between letters.
  function collideAll(passes, bounce) {
    const L = state.letters;
    for (let p = 0; p < passes; p++) {
      for (let i = 0; i < L.length; i++) {
        const a = L[i];
        if (a.ch === ' ') continue;
        for (let j = i + 1; j < L.length; j++) {
          const b = L[j];
          if (b.ch === ' ') continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const ox = (a.w + b.w) * .46 - Math.abs(dx);
          const oy = (a.h + b.h) * .4 - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;
          let nx = 0, ny = 0, pen;
          if (ox < oy) { nx = dx < 0 ? -1 : 1; pen = ox; }
          else { ny = dy < 0 ? -1 : 1; pen = oy; }
          const aFixed = a === state.active, bFixed = b === state.active;
          const share = (aFixed || bFixed) ? 1 : .5;
          if (!aFixed) { a.x -= nx * pen * share; a.y -= ny * pen * share; }
          if (!bFixed) { b.x += nx * pen * share; b.y += ny * pen * share; }
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) {
            const impulse = -rel * bounce;
            if (!aFixed) { a.vx -= impulse * nx; a.vy -= impulse * ny; }
            if (!bFixed) { b.vx += impulse * nx; b.vy += impulse * ny; }

    }
  }
  function bounds(a, floor, dt) {
    const hw = a.w * .46, hh = a.h * .4;
    if (a.y + hh > floor) {
      a.y = floor - hh; a.vy *= -.66; a.vx *= Math.pow(.985, dt);
      a.va += (Math.random() - .5) * .006 * dt;
      if (Math.abs(a.vy) < .65) a.vy = 0;
    }
    if (hh * 2 < floor && a.y - hh < 0) { a.y = hh; a.vy = Math.abs(a.vy) * .55; }
    if (hw * 2 < W) {
      if (a.x - hw < 0) { a.x = hw; a.vx = Math.abs(a.vx) * .72; }
      if (a.x + hw > W) { a.x = W - hw; a.vx = -Math.abs(a.vx) * .72; }
    }
  }
  // The logo is a solid box that letters cannot enter.
  function logoBox() {
    const r = logoEl.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, hw: r.width / 2, hh: r.height / 2 };
  }
  function avoidLogo(a, box) {
    if (a.ch === ' ') return;
    const dx = a.x - box.x, dy = a.y - box.y;
    const ox = a.w * .46 + box.hw - Math.abs(dx);
    const oy = a.h * .4 + box.hh - Math.abs(dy);
    if (ox <= 0 || oy <= 0) return;
    if (ox < oy) { const s = dx < 0 ? -1 : 1; a.x += s * ox; if (a.vx * s < 0) a.vx *= -.5; }
    else { const s = dy < 0 ? -1 : 1; a.y += s * oy; if (a.vy * s < 0) a.vy *= -.5; }
  }

  function physics(dt, box) {
    const L = state.letters;
    if (state.gravity) {
      const floor = floorY();
      for (const a of L) {
        if (a === state.active) continue;
        a.vy += .42 * dt;
        a.x += a.vx * dt; a.y += a.vy * dt;
        a.angle += a.va * dt;
        a.vx *= Math.pow(.999, dt); a.va *= Math.pow(.995, dt);
        bounds(a, floor, dt);
      }
      collideAll(2, .5);
    } else if (state.magnet && state.magnetTarget) {
      // Each letter pulls towards the pointer on its own and bumps into the others.
      const t = state.magnetTarget;
      for (const a of L) {
        a.vx += (t.x - a.x) * .075 * dt;
        a.vy += (t.y - a.y) * .075 * dt;
        a.vx *= Math.pow(.78, dt);
        a.vy *= Math.pow(.78, dt);
        a.x += a.vx * dt; a.y += a.vy * dt;
        a.angle *= Math.pow(.9, dt);
        a.va = 0;
      }
      collideAll(3, .5);
    } else if (state.flying) {
      const floor = floorY();
      let moving = false;
      for (const a of L) {
        if (a === state.active) continue;
        a.x += a.vx * dt; a.y += a.vy * dt;
        a.angle += a.va * dt;
        const drag = Math.pow(.982, dt);
        a.vx *= drag; a.vy *= drag; a.va *= Math.pow(.985, dt);
        bounds(a, floor, dt);
        if (Math.abs(a.vx) > .05 || Math.abs(a.vy) > .05 || Math.abs(a.va) > .001) moving = true;
      }
      collideAll(2, .95);
      if (!moving) { state.flying = false; for (const a of L) { a.vx = 0; a.vy = 0; a.va = 0; } }
    }
    if (state.dirty) for (const a of L) avoidLogo(a, box);
  }

  function hit(p) {
    for (let i = state.letters.length - 1; i >= 0; i--) {
      const a = state.letters[i];
      if (a.ch === ' ') continue;
      const dx = p.x - a.x, dy = p.y - a.y;
      if (Math.abs(dx) < Math.max(a.w * .55, 18) && Math.abs(dy) < Math.max(a.h * .7, 22)) return a;
    }
    return null;
  }

  function frame(now) {
    const dt = Math.min((now - state.last) / 16.667 || 1, 2.2);
    state.last = now;
    const size = fontSize();
    const L = state.letters;
    ctx.clearRect(0, 0, W, H);
    state.hover = (state.mouse && !state.active) ? hit(state.mouse) : null;

    // Fast letters move in several small steps so they cannot pass through each other.
    let vmax = 0;
    for (const a of L) vmax = Math.max(vmax, Math.abs(a.vx), Math.abs(a.vy));
    const steps = clamp(Math.ceil(vmax * dt / (size * .08)), 1, 16);
    const box = logoBox();
    for (let i = 0; i < steps; i++) physics(dt / steps, box);

    L.forEach(a => drawLetter(a, size));
    drawCaret(now, size);
    requestAnimationFrame(frame);
  }

  function point(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', e => {
    setPanel(false);
    const p = point(e);
    state.mouse = p;
    if (state.magnet) { state.magnetTarget = p; return; }
    const a = hit(p);
    if (a) {
      state.active = a; state.dirty = true;
      state.pointer = { dx: p.x - a.x, dy: p.y - a.y, px: p.x, py: p.y };
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = 'grabbing';
    }
  });
  canvas.addEventListener('pointermove', e => {
    const p = point(e);
    state.mouse = p;
    if (state.magnet && !state.active) {
      state.magnetTarget = p;
      canvas.style.cursor = 'none';
      return;
    }
    if (!state.active || !state.pointer) return;
    const a = state.active;
    a.x = p.x - state.pointer.dx; a.y = p.y - state.pointer.dy;
    a.vx = (p.x - state.pointer.px) * .75; a.vy = (p.y - state.pointer.py) * .75;
    state.pointer.px = p.x; state.pointer.py = p.y;
  });
  function release(e) {
    state.active = null; state.pointer = null;
    canvas.style.cursor = state.magnet ? 'none' : 'text';
    if (e && e.pointerType === 'touch') state.mouse = null;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', () => { if (!state.active) state.mouse = null; });

  function setGravityOff() {
    state.gravity = false;
    gravityButton.setAttribute('aria-pressed', 'false');
  }
  function setPanel(open) {
    panel.hidden = !open;
    moreButton.setAttribute('aria-pressed', String(open));
  }
  // One entry point for keyboard and picker, so both behave the same.
  function typeChar(ch) {
    if (state.locked || [...state.text].length >= 24) return;
    state.text += ch;
    setGravityOff();
    state.blink = performance.now();
    layout(false);
  }
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { setPanel(false); return; }
    if (e.key === ' ') e.preventDefault(); // Space must never activate a focused button.
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const before = fontSize();
      state.sizeScale = clamp(state.sizeScale * (e.key === 'ArrowUp' ? 1.1 : 1 / 1.1), .35, 12);
      refit(before);
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      state.weightIndex = (state.weightIndex + (e.key === 'ArrowRight' ? 1 : -1) + weights.length) % weights.length;
      refit(null);
      return;
    }
    if (state.locked) return;
    if (e.key === 'Enter') {
      if (state.text.length) { state.locked = true; state.active = null; state.pointer = null; }
      e.preventDefault();
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      state.text = [...state.text].slice(0, -1).join('');
      setGravityOff();
      state.blink = performance.now();
      layout(false);
    } else if (e.key.length === 1) {
      e.preventDefault();
      typeChar(e.key);
    }
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });

  gravityButton.addEventListener('click', () => {
    state.gravity = !state.gravity;
    if (state.gravity) {
      state.magnet = false;
      state.dirty = true;
      magnetButton.setAttribute('aria-pressed', 'false');
      canvas.style.cursor = 'text';
      state.letters.forEach(a => { a.vy -= 1.2; a.vx += (Math.random() - .5) * 1.2; a.va += (Math.random() - .5) * .025; });
    }
    gravityButton.setAttribute('aria-pressed', String(state.gravity));
  });
  magnetButton.addEventListener('click', () => {
    state.magnet = !state.magnet;
    if (state.magnet) {
      setGravityOff();
      state.dirty = true;
      state.magnetTarget = { x: W / 2, y: H * .49 };
      canvas.style.cursor = 'none';
    } else {
      state.magnetTarget = null;
      canvas.style.cursor = 'text';
    }
    magnetButton.setAttribute('aria-pressed', String(state.magnet));
  });
  // Every letter leaves in its own direction.
  explodeButton.addEventListener('click', () => {
    const L = state.letters;
    if (!L.length) return;
    state.dirty = true;
    state.flying = true;
    const n = L.length, step = Math.PI * 2 / n, offset = Math.random() * Math.PI * 2;
    const angles = L.map((_, i) => offset + i * step + (Math.random() - .5) * step * .6);
    for (let i = angles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [angles[i], angles[j]] = [angles[j], angles[i]];
    }
    L.forEach((a, i) => {
      const speed = (.006 + Math.random() * .01) * (W + H);
      a.vx += Math.cos(angles[i]) * speed;
      a.vy += Math.sin(angles[i]) * speed;
      a.va += (Math.random() - .5) * .5;
    });
  });
  moreButton.addEventListener('click', () => setPanel(panel.hidden));
  darkButton.addEventListener('click', () => {
    state.dark = !state.dark;
    document.documentElement.classList.toggle('dark', state.dark);
    darkButton.setAttribute('aria-pressed', String(state.dark));
  });
  resetButton.addEventListener('click', () => {
    state.text = ''; state.gravity = false; state.magnet = false; state.locked = false;
    state.magnetTarget = null;
    state.sizeScale = 1; state.weightIndex = DEFAULT_WEIGHT;
    state.blink = performance.now();
    canvas.style.cursor = 'text';
    gravityButton.setAttribute('aria-pressed', 'false');
    magnetButton.setAttribute('aria-pressed', 'false');
    layout(false);
  });

  // Character picker.
  GLYPHS.forEach(ch => {
    const b = document.createElement('button');
    b.textContent = ch;
    b.setAttribute('aria-label', 'Type ' + ch);
    grid.appendChild(b);
  });
  grid.addEventListener('mousedown', e => e.preventDefault());
  grid.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) typeChar(b.textContent);
  });

  // Buttons never keep focus, so Space and Enter cannot trigger them by accident.
  [gravityButton, magnetButton, explodeButton, moreButton, darkButton, resetButton].forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => b.blur());
  });

  function loadFonts() {
    const jobs = weights.map(w => document.fonts.load(`${w} 100px Inter`, 'Aa'));
    jobs.push(document.fonts.load('400 100px "Inter Glyphs"', GLYPHS.join('')));
    return Promise.all(jobs).catch(() => {});
  }
  loadFonts().then(() => refit(null));
  if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => refit(null));
  window.addEventListener('resize', resize);
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
